name: Build APK Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Clean existing Android directory
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable and set SDK path
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ANDROID_HOME is: $ANDROID_HOME"
          cat android/local.properties

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK for upload
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/DayFlow-v${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.apk
          name: DayFlow v${{ steps.version.outputs.version }}
          body: |
            ## 📱 DayFlow v${{ steps.version.outputs.version }}
            
            ### Download
            - **DayFlow-v${{ steps.version.outputs.version }}.apk** - Install on your Android phone
            
            ### Installation Instructions
            1. Download the APK file above
            2. Open it on your Android phone
            3. Allow installation from unknown sources if prompted
            4. Tap "Install"
            5. Open DayFlow and start planning your day!
            
            ### What's New
            - Daily planner with time-block scheduling
            - Task management with priorities and categories
            - Progress tracking with daily/weekly/monthly reports
            - Colorful notes system
            - Offline support - works without internet
            - Beautiful dashboard with quick stats
            
            ### Features
            📋 Smart Task Management
            📅 Visual Daily Schedule (6 AM - 9 PM)
            📊 Progress Reports & Analytics
            📝 Quick Notes
            🏠 Smart Dashboard
            
            ---
            **Note:** This APK is built from open-source code. Your data stays on your device - no accounts or internet required!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DayFlow-APK
          path: release/*.apk
          retention-days: 30
